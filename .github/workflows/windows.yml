name: Windows

on:
  pull_request:
    paths-ignore:
      - 'doc/**'
      - '**/*.md'
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'doc/**'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
    - name: Build Windows
      shell: cmd
      run: .\winmake.bat all
